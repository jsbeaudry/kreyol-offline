# Build the cloud TTS image on x86 and push it to GHCR.
#
# This runs here rather than on a laptop for two reasons: the target is an x86_64 CUDA GPU while the
# development machine is arm64, and cross-building a CUDA image under emulation takes hours. A runner
# builds it natively.
name: cloud-tts image

on:
  workflow_dispatch:
    inputs:
      cuda_archs:
        description: 'CUDA architectures (86=Ampere (A5000, 3090, A4000, A40), 89=Ada (L4, RTX 2000 Ada, 4090)). Fewer builds faster.'
        default: '86;89'
      tag:
        description: 'Extra tag for this image'
        default: ''
  push:
    branches: [main]
    paths: ['cloud/**', '.github/workflows/cloud-tts.yml']

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/kreyol-tts-cloud

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # A CUDA devel stage plus the build tree does not fit beside the runner's preinstalled
      # toolchains. Reclaiming this is the difference between a build and a disk-full failure.
      - name: Make room on the runner
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./cloud
          push: true
          platforms: linux/amd64
          build-args: |
            CUDA_ARCHS=${{ inputs.cuda_archs || '86;89' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ inputs.tag && format('{0}:{1}', env.IMAGE, inputs.tag) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Where it went
        run: |
          echo "pushed ${{ env.IMAGE }}:latest"
          echo "Make the package public in the repo's Packages settings, or give the"
          echo "endpoint registry credentials, before deploying."
